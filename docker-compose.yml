services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoanomaly-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - geoanomaly_data:/app/data
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: geoanomaly-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  geoanomaly_data:
